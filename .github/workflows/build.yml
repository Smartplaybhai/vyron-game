name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Add google-services.json
        run: |
          cp google-services.json android/app/google-services.json

      - name: Enable Google Services Gradle plugin
        run: |
          sed -i "s/classpath 'com.android.tools.build:gradle:.*'/&\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle
          sed -i "0,/apply plugin: 'com.android.application'/s//&\napply plugin: 'com.google.gms.google-services'/" android/app/build.gradle

      - name: Add Google Sign-In dependency
        run: |
          sed -i "/^dependencies {/a\\    implementation 'com.google.android.gms:play-services-auth:21.2.0'" android/app/build.gradle

      - name: Copy custom icons
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.webp
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.webp
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/drawable-land
          mkdir -p android/app/src/main/res/drawable-port
          cp icons/splash.png android/app/src/main/res/drawable/splash.png
          cp icons/splash.png android/app/src/main/res/drawable-land/splash.png
          cp icons/splash.png android/app/src/main/res/drawable-port/splash.png

      - name: Print applicationId
        run: cat android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
